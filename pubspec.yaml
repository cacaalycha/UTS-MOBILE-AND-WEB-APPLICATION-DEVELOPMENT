name: case_iphone_caca
description: "Case iPhone Caca - Katalog case iPhone dengan Compatibility Checker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # Praktikum Minggu 9 — Firebase Authentication (Email/Password, target Chrome).
  # Versi mengikuti modul: firebase_core 5.1.0 + firebase_auth 7.0.1.
  firebase_core: 5.1.0
  firebase_auth: 7.0.1

  # CATATAN: Firestore BELUM dipakai (baru Minggu 10). Katalog, keranjang,
  # dan pesanan UTS masih memakai implementasi Mock*Repo; hanya autentikasi
  # yang tersambung ke Firebase, lihat lib/firebase_login_app.dart.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
