name: case_iphone_caca
description: "Case iPhone Caca - Katalog case iPhone dengan Compatibility Checker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  # Firebase — versi mengikuti modul Minggu 9 & Minggu 10.
  # Minggu 9: firebase_core 5.1.0 + firebase_auth 7.0.1 (Email/Password).
  # Minggu 10: cloud_firestore 7.1.0 (users, cases, orders).
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0

  # Mode prototipe UTS tanpa --dart-define tetap memakai implementasi Mock*Repo
  # untuk katalog/keranjang/pesanan. Mode Firebase memakai FirebaseKatalogApp
  # dengan LayananFirestore; lihat lib/main.dart dan lib/firebase_katalog_app.dart.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
